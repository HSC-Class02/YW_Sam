name: Update and Deploy

"on":
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "data/**"
  workflow_dispatch:
  schedule:
    # 00:20 UTC on the first day of each month (09:20 in Korea)
    - cron: "20 0 1 * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-main
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Support both secret names used by this project.
      DART_API_KEY_CONFIGURED: ${{ secrets.OPENDART_API_KEY != '' || secrets.DART_API_KEY != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with latest main
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate crawler and initial JSON
        run: |
          python -m py_compile scripts/update_financials.py
          python -c "import json; json.load(open('data/metrics.json', encoding='utf-8'))"

      - name: Collect OpenDART financial data
        if: ${{ env.DART_API_KEY_CONFIGURED == 'true' }}
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY || secrets.DART_API_KEY }}
        run: python scripts/update_financials.py

      - name: Validate collected financial data
        if: ${{ env.DART_API_KEY_CONFIGURED == 'true' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          metrics = json.loads(Path("data/metrics.json").read_text(encoding="utf-8"))
          counts = {
              "annual": len(metrics.get("annual") or []),
              "halfyear": len(metrics.get("halfyear") or []),
              "quarterly": len(metrics.get("quarterly") or []),
          }
          total = sum(counts.values())
          print("Collected records:", counts)
          if total == 0:
              raise SystemExit(
                  "ERROR: OpenDART returned no financial records. "
                  "Check the API key, company code, API quota, and crawler log."
              )
          if metrics.get("company") != "삼성전자" or metrics.get("stock_code") != "005930":
              raise SystemExit("ERROR: The generated dataset does not match Samsung Electronics (005930).")
          if metrics.get("data_status") != "정상 수집":
              raise SystemExit("ERROR: The generated dataset is not marked as successfully collected.")
          PY

      - name: Explain missing API secret
        if: ${{ env.DART_API_KEY_CONFIGURED != 'true' }}
        run: |
          echo "::warning::Neither OPENDART_API_KEY nor DART_API_KEY is configured. The dashboard UI will deploy, but financial data will remain empty."
          echo "Add the OpenDART key as a repository or github-pages environment Actions secret named OPENDART_API_KEY (recommended) or DART_API_KEY, then run this workflow manually."

      - name: Commit refreshed data
        if: ${{ env.DART_API_KEY_CONFIGURED == 'true' }}
        run: |
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/annual.csv data/halfyear.csv data/quarterly.csv data/metrics.json
            git commit -m "Refresh Samsung Electronics financial data"
            # A concurrent README or workflow update may advance main while collection runs.
            git pull --rebase origin main
            git push
          else
            echo "No data changes to commit."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

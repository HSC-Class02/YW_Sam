name: Update and Deploy

on:
  workflow_dispatch:
  schedule:
    # 00:20 UTC on the first day of each month (09:20 in Korea)
    - cron: "20 0 1 * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Collect OpenDART financial data
        if: \${{ secrets.OPENDART_API_KEY != '' }}
        env:
          OPENDART_API_KEY: \${{ secrets.OPENDART_API_KEY }}
        run: python scripts/update_financials.py

      - name: Explain missing API secret
        if: \${{ secrets.OPENDART_API_KEY == '' }}
        run: |
          echo "::warning::OPENDART_API_KEY is not configured. The dashboard will deploy, but financial data will remain empty until the secret is added."
          echo "Add OPENDART_API_KEY in Settings > Secrets and variables > Actions, then run this workflow manually."

      - name: Commit refreshed data
        if: \${{ secrets.OPENDART_API_KEY != '' }}
        run: |
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/annual.csv data/halfyear.csv data/quarterly.csv data/metrics.json
            git commit -m "Refresh Samsung Electronics financial data"
            git push
          else
            echo "No data changes to commit."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
